<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-in · KERIDAINE</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
      }
    }
  </script>
  <style>
    /* Estilos adicionais para o checkin */
    .scanner-container {
      max-width: 480px;
      margin: 0 auto;
    }
    #reader {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #000;
      margin: 0 auto;
    }
    .result-box {
      margin-top: 1.2rem;
      padding: 1.2rem;
      border-radius: var(--radius-sm);
      text-align: center;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.4rem;
    }
    .result-box.success {
      border-color: #22c55e;
      background: rgba(34,197,94,0.1);
    }
    .result-box.error {
      border-color: #ef4444;
      background: rgba(239,68,68,0.1);
    }
    .result-box .btn-primary {
      font-size: 0.8rem;
      padding: 0.4rem 1.2rem;
    }
    .manual-input {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.8rem;
    }
    .manual-input input {
      flex: 1;
      padding: 0.5rem 0.8rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: var(--text-dark);
      font-size: 0.9rem;
    }
    .manual-input input:focus {
      outline: none;
      border-color: var(--lilac);
    }
  </style>
</head>
<body>
  <div class="site-wrapper" style="padding-top:2rem;">
    <div style="max-width:560px; margin:0 auto;">
      <h2 class="heading-lg font-serif" style="text-align:center; margin-bottom:0.4rem;">🎫 Check-in</h2>
      <p class="text-body" style="text-align:center; margin-bottom:1.5rem;">Aponte a câmera para o QR Code do ingresso</p>

      <div class="scanner-container glass" style="padding:1.2rem;">
        <div id="reader"></div>

        <!-- Resultado -->
        <div id="result" class="result-box">
          <span style="color:var(--text-light); font-size:0.9rem;">Aguardando leitura...</span>
        </div>

        <!-- Entrada manual -->
        <div class="manual-input">
          <input type="text" id="manualTransacao" placeholder="Digite o número da transação" />
          <button class="btn-primary" id="manualCheckBtn" style="padding:0.5rem 1.2rem; font-size:0.8rem;">Verificar</button>
        </div>
        <p style="font-size:0.6rem; color:var(--text-light); opacity:0.5; text-align:center; margin-top:0.4rem;">ou insira manualmente o número da transação</p>
      </div>

      <!-- Botão voltar -->
      <div style="text-align:center; margin-top:1.5rem;">
        <a href="index.html" class="btn-outline">← Voltar para o evento</a>
      </div>
    </div>
  </div>

  <script type="module">
    // ============================================================
    // IMPORTAÇÕES
    // ============================================================
    import { initializeApp } from 'firebase/app';
    import { getFirestore, doc, getDoc, updateDoc } from 'firebase/firestore';

    const firebaseConfig = {
      apiKey: "AIzaSyC5J0pPP1nqzL1rTqY-vLTVaevWSwDQwdc",
      authDomain: "keridaine-4c0e5.firebaseapp.com",
      projectId: "keridaine-4c0e5",
      storageBucket: "keridaine-4c0e5.firebasestorage.app",
      messagingSenderId: "914860118360",
      appId: "1:914860118360:web:8778db5b547519d236152d",
      measurementId: "G-2E8E9GPTRW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const resultDiv = document.getElementById('result');

    // ============================================================
    // FUNÇÃO PARA VERIFICAR INGRESSO
    // ============================================================
    async function verificarIngresso(transacao) {
      if (!transacao || transacao.trim() === '') {
        resultDiv.className = 'result-box error';
        resultDiv.innerHTML = '⚠️ Informe um número de transação.';
        return;
      }

      try {
        const docRef = doc(db, 'ingressos', transacao.trim());
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          resultDiv.className = 'result-box error';
          resultDiv.innerHTML = `❌ Ingresso não encontrado.<br><small style="font-size:0.7rem;">Transação: ${transacao}</small>`;
          return;
        }

        const data = docSnap.data();
        const status = data.status || 'ativo';

        if (status === 'usado') {
          resultDiv.className = 'result-box error';
          resultDiv.innerHTML = `
            ❌ Ingresso já foi utilizado.<br>
            <small style="font-size:0.7rem;">${data.nome || 'Pagante'}</small>
          `;
          return;
        }

        // INGRESSO VÁLIDO ✅
        resultDiv.className = 'result-box success';
        resultDiv.innerHTML = `
          ✅ <strong>Ingresso válido!</strong><br>
          <span style="font-size:0.9rem;">${data.nome || 'Pagante'}</span><br>
          <small style="font-size:0.7rem; opacity:0.6;">Transação: ${transacao}</small>
          <div style="margin-top:0.6rem; display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap;">
            <button class="btn-primary" id="confirmarUsoBtn" data-transacao="${transacao}" style="font-size:0.8rem; padding:0.3rem 1.2rem;">
              ✅ Confirmar entrada
            </button>
            <button class="btn-outline" id="cancelarCheckBtn" style="font-size:0.8rem; padding:0.3rem 1.2rem;">
              Cancelar
            </button>
          </div>
        `;

        // Adicionar evento para confirmar uso
        document.getElementById('confirmarUsoBtn')?.addEventListener('click', async function() {
          const t = this.dataset.transacao;
          try {
            const ref = doc(db, 'ingressos', t);
            await updateDoc(ref, { status: 'usado', dataUso: new Date().toISOString() });
            resultDiv.className = 'result-box success';
            resultDiv.innerHTML = `
              ✅ Entrada confirmada com sucesso!<br>
              <small style="font-size:0.7rem; opacity:0.6;">Ingresso marcado como utilizado.</small>
              <div style="margin-top:0.6rem;">
                <button class="btn-primary" id="novaLeituraBtn" style="font-size:0.8rem; padding:0.3rem 1.2rem;">📷 Escanear outro</button>
              </div>
            `;
            document.getElementById('novaLeituraBtn')?.addEventListener('click', () => {
              resultDiv.className = 'result-box';
              resultDiv.innerHTML = '<span style="color:var(--text-light); font-size:0.9rem;">Aguardando leitura...</span>';
              html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
            });
          } catch (err) {
            console.error(err);
            resultDiv.className = 'result-box error';
            resultDiv.innerHTML = `⚠️ Erro ao confirmar uso: ${err.message}`;
          }
        });

        document.getElementById('cancelarCheckBtn')?.addEventListener('click', () => {
          resultDiv.className = 'result-box';
          resultDiv.innerHTML = '<span style="color:var(--text-light); font-size:0.9rem;">Aguardando leitura...</span>';
          html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        });

      } catch (error) {
        console.error(error);
        resultDiv.className = 'result-box error';
        resultDiv.innerHTML = `⚠️ Erro ao verificar: ${error.message}`;
      }
    }

    // ============================================================
    // SCANNER QR CODE
    // ============================================================
    const config = {
      fps: 10,
      qrbox: { width: 200, height: 200 },
      aspectRatio: 1.0
    };

    let html5QrCode = new Html5Qrcode("reader");

    function onScanSuccess(decodedText, decodedResult) {
      // Para evitar múltiplas leituras
      html5QrCode.stop();
      resultDiv.className = 'result-box';
      resultDiv.innerHTML = '⏳ Verificando ingresso...';
      verificarIngresso(decodedText);
    }

    function onScanError(errorMessage) {
      // Ignora erros de leitura (são normais)
    }

    // Inicia a câmera
    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanError)
      .catch(err => {
        console.warn('Erro ao iniciar câmera:', err);
        resultDiv.className = 'result-box error';
        resultDiv.innerHTML = `
          ⚠️ Não foi possível acessar a câmera.<br>
          <small style="font-size:0.7rem;">Verifique as permissões ou use a entrada manual.</small>
        `;
      });

    // ============================================================
    // VERIFICAÇÃO MANUAL
    // ============================================================
    document.getElementById('manualCheckBtn').addEventListener('click', function() {
      const input = document.getElementById('manualTransacao');
      const val = input.value.trim();
      if (val) {
        html5QrCode.stop().catch(() => {});
        verificarIngresso(val);
      } else {
        alert('Digite o número da transação.');
      }
    });

    document.getElementById('manualTransacao').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('manualCheckBtn').click();
      }
    });

    // ============================================================
    // LIMPEZA AO SAIR
    // ============================================================
    window.addEventListener('beforeunload', function() {
      html5QrCode.stop().catch(() => {});
    });
  </script>
</body>
</html>
