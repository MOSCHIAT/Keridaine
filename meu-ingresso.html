<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Ingresso · KERIDAINE</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Firebase (modular) -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
      }
    }
  </script>
</head>
<body>
  <div class="site-wrapper" style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1rem;">
    <div id="ticket-container" style="width:80mm; max-width:100%;">
      <!-- O ticket será renderizado via JavaScript -->
      <div id="ticket-loading" class="glass" style="padding:2rem; text-align:center; color:var(--text-soft);">
        ⏳ Carregando seu ingresso...
      </div>
    </div>
  </div>

  <script type="module">
    // ============================================================
    // IMPORTAÇÕES
    // ============================================================
    import { initializeApp } from 'firebase/app';
    import { getFirestore, doc, getDoc, updateDoc } from 'firebase/firestore';

    // Configuração Firebase (mesma do index)
    const firebaseConfig = {
      apiKey: "AIzaSyC5J0pPP1nqzL1rTqY-vLTVaevWSwDQwdc",
      authDomain: "keridaine-4c0e5.firebaseapp.com",
      projectId: "keridaine-4c0e5",
      storageBucket: "keridaine-4c0e5.firebasestorage.app",
      messagingSenderId: "914860118360",
      appId: "1:914860118360:web:8778db5b547519d236152d",
      measurementId: "G-2E8E9GPTRW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ============================================================
    // PARÂMETROS DA URL
    // ============================================================
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id'); // número da transação

    const container = document.getElementById('ticket-container');

    if (!id) {
      container.innerHTML = `
        <div class="glass" style="padding:2rem; text-align:center; color:var(--text-soft);">
          ❌ Nenhum ingresso especificado.<br>
          <small style="font-size:0.8rem;">Use ?id=TRANSACAO na URL</small>
        </div>
      `;
      throw new Error('ID não fornecido');
    }

    // ============================================================
    // BUSCAR DADOS DO INGRESSO
    // ============================================================
    async function loadTicket() {
      try {
        const docRef = doc(db, 'ingressos', id);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          container.innerHTML = `
            <div class="glass" style="padding:2rem; text-align:center; color:#991b1b;">
              ❌ Ingresso não encontrado.<br>
              <small style="font-size:0.8rem;">Transação: ${id}</small>
            </div>
          `;
          return;
        }

        const data = docSnap.data();
        renderTicket(data);
      } catch (error) {
        console.error('Erro ao carregar ingresso:', error);
        container.innerHTML = `
          <div class="glass" style="padding:2rem; text-align:center; color:#991b1b;">
            ⚠️ Erro ao carregar ingresso.<br>
            <small style="font-size:0.8rem;">${error.message}</small>
          </div>
        `;
      }
    }

    // ============================================================
    // RENDERIZAR O TICKET COM QR CODE
    // ============================================================
    function renderTicket(data) {
      const { transacao, nome, email, valorPago, totalReceber, dataPagamento, hora, dataEvento, local, status } = data;

      // Cria o wrapper do ticket
      const ticketHTML = `
        <div class="ticket-receipt" style="background:rgba(255,255,255,0.14); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.3); border-radius:var(--radius); padding:1.2rem 1rem 1rem; position:relative; overflow:hidden;">
          <div class="shimmer" style="position:absolute; top:-50%; right:-30%; width:80%; height:200%; background:radial-gradient(circle at 70% 40%, rgba(255,255,255,0.06), transparent 70%); pointer-events:none; border-radius:50%; z-index:0;"></div>
          <div class="bottom-bar" style="position:absolute; bottom:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--lilac), var(--rose), var(--sky), var(--mint), var(--butter)); opacity:0.4; border-radius:0 0 var(--radius) var(--radius); z-index:0;"></div>
          <div class="watermark" style="position:absolute; bottom:-8px; right:-4px; font-family:'Playfair Display',serif; font-size:4rem; font-weight:700; color:rgba(255,255,255,0.03); pointer-events:none; user-select:none; z-index:0;">✦</div>

          <div class="receipt-content" style="position:relative; z-index:1;">
            <!-- HEADER -->
            <div class="receipt-header" style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.4rem; margin-bottom:0.8rem; flex-wrap:wrap;">
              <div class="receipt-brand">
                <div class="event-name" style="font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:700; color:var(--text-dark);">KERIDAINE</div>
                <div class="event-sub" style="font-size:0.5rem; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-light); opacity:0.7;">Baile de Máscaras</div>
              </div>
              <div style="display:flex; align-items:center; gap:0.3rem; flex-wrap:wrap;">
                <span class="receipt-badge" style="display:inline-flex; align-items:center; gap:0.3rem; font-size:0.5rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-soft); background:rgba(255,255,255,0.2); padding:0.15rem 0.6rem 0.15rem 0.5rem; border-radius:100px; border:1px solid rgba(255,255,255,0.2);">
                  <span style="display:inline-block; width:5px; height:5px; border-radius:50%; background:#4ade80; animation:pulseDot 2s ease-in-out infinite;"></span>Confirmado
                </span>
                <span class="receipt-status" style="font-size:0.5rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#22c55e; background:rgba(34,197,94,0.12); padding:0.15rem 0.7rem; border-radius:100px; border:1px solid rgba(34,197,94,0.15);">✓ ${status === 'usado' ? 'Usado' : 'Pago'}</span>
              </div>
            </div>

            <!-- DIVIDER -->
            <div class="receipt-divider" style="display:flex; align-items:center; gap:0.6rem; margin:0.6rem 0 0.8rem;">
              <span class="line" style="flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);"></span>
              <span class="diamond" style="color:var(--text-light); opacity:0.2; font-size:0.4rem;">◆</span>
              <span class="line" style="flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);"></span>
            </div>

            <!-- INFORMAÇÕES -->
            <div class="receipt-grid" style="display:flex; flex-direction:column; gap:0.4rem;">
              <div class="receipt-field" style="display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px dashed rgba(255,255,255,0.06); padding-bottom:0.3rem;">
                <span class="label" style="font-size:0.5rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-light); opacity:0.6; flex-shrink:0; margin-right:0.6rem;">Pagante</span>
                <span class="value" style="font-weight:600; font-size:0.75rem; text-align:right;">${nome || 'Não informado'}</span>
              </div>
              <div class="receipt-field" style="display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px dashed rgba(255,255,255,0.06); padding-bottom:0.3rem;">
                <span class="label" style="font-size:0.5rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-light); opacity:0.6; flex-shrink:0; margin-right:0.6rem;">E-mail</span>
                <span class="value mono" style="font-family:'Inter',monospace; letter-spacing:0.02em; text-align:right;">${email || 'Não informado'}</span>
              </div>
              <div class="receipt-field" style="display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px dashed rgba(255,255,255,0.06); padding-bottom:0.3rem;">
                <span class="label" style="font-size:0.5rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-light); opacity:0.6; flex-shrink:0; margin-right:0.6rem;">Data / Hora</span>
                <span class="value" style="text-align:right;">${dataPagamento || '--/---'} · ${hora || '--:--'}</span>
              </div>
              <div class="receipt-field" style="display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px dashed rgba(255,255,255,0.06); padding-bottom:0.3rem;">
                <span class="label" style="font-size:0.5rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-light); opacity:0.6; flex-shrink:0; margin-right:0.6rem;">N.° Transação</span>
                <span class="value mono" style="font-family:'Inter',monospace; font-size:0.65rem; text-align:right;">${transacao}</span>
              </div>
              <!-- VALORES -->
              <div class="receipt-field" style="border-bottom:none; padding-bottom:0; flex-direction:column; align-items:stretch; gap:0.2rem;">
                <span class="label" style="margin-right:0; font-size:0.5rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-light); opacity:0.6;">Detalhamento</span>
                <div class="amount-box" style="background:rgba(255,255,255,0.08); border-radius:var(--radius-sm); padding:0.6rem 0.8rem; border:1px solid rgba(255,255,255,0.08);">
                  <div class="amount-row" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.2rem;">
                    <span class="label-sm" style="font-size:0.5rem; font-weight:500; color:var(--text-light); letter-spacing:0.04em;">Total a receber em</span>
                    <span style="display:flex; align-items:center; gap:0.3rem;">
                      <span class="badge-date" style="font-size:0.5rem; font-weight:500; color:var(--text-light); background:rgba(255,255,255,0.04); padding:0.1rem 0.5rem; border-radius:100px; border:1px solid rgba(255,255,255,0.04);">${dataEvento || '--/---'}</span>
                      <span class="value-sm" style="font-weight:700; font-size:0.7rem;">R$ ${(totalReceber || 0).toFixed(2)}</span>
                    </span>
                  </div>
                  <div class="amount-row total" style="border-top:1px solid rgba(255,255,255,0.06); padding-top:0.3rem; margin-top:0.2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.2rem;">
                    <span class="label-sm" style="font-weight:600; font-size:0.5rem; color:var(--text-soft);">Valor pago</span>
                    <span class="value-sm" style="font-size:1.1rem; font-weight:700;">R$ ${(valorPago || 0).toFixed(2)}</span>
                  </div>
                  <div class="amount-footer" style="display:flex; justify-content:flex-end; margin-top:0.1rem;">
                    <span style="font-size:0.45rem; color:var(--text-light); opacity:0.4; letter-spacing:0.04em;">Pago via PIX · Confirmado</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- FOOTER com QR Code -->
            <div class="receipt-footer" style="margin-top:0.8rem; padding-top:0.6rem; border-top:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.4rem;">
              <div class="footer-left" style="display:flex; align-items:center; gap:0.6rem;">
                <div id="qrcode-container" style="background:white; padding:4px; border-radius:6px; width:50px; height:50px; display:flex; align-items:center; justify-content:center;"></div>
                <span class="qr-label" style="font-size:0.4rem; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-light); opacity:0.4;">QR Code</span>
              </div>
              <div class="footer-right" style="text-align:right; font-size:0.45rem; color:var(--text-light); opacity:0.5; letter-spacing:0.02em; line-height:1.4;">
                <div>${dataEvento || '--/---'} · 20h</div>
                <div style="opacity:0.4;">${local || 'Local não informado'}</div>
              </div>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = ticketHTML;

      // Gerar QR Code dentro do container
      const qrContainer = document.getElementById('qrcode-container');
      if (qrContainer) {
        new QRCode(qrContainer, {
          text: transacao, // apenas o número da transação
          width: 50,
          height: 50,
          colorDark: "#1e1a2b",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    }

    // ============================================================
    // INICIAR
    // ============================================================
    loadTicket();
  </script>
</body>
</html>
